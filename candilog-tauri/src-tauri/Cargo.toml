[package]
name = "candilog"
version = "0.3.0"
edition = "2021"
rust-version = "1.91"
description = "Candilog — suivi de candidatures, entretiens et relances avec assistance IA locale"
authors = ["Candilog"]
license = "MIT"

[lib]
# Tauri exige une bibliothèque nommée `<nom>_lib` sur mobile ; la garder sur desktop
# permet aussi aux tests d'intégration de viser le métier sans passer par le binaire.
name = "candilog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"

# `rusqlite` et `r2d2` sont conservés depuis l'application Iced : les dépôts SQL et
# leurs tests sont repris tels quels (cf. docs/migration/01-AUDIT.md, décision B).
# Les commandes Tauri restent asynchrones en enveloppant les appels de service dans
# `tauri::async_runtime::spawn_blocking`.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# Analyse d'URL des champs « site web » et « profil LinkedIn ». Crate autonome plutôt que
# `reqwest::Url` : la validation vit dans `core` et n'a aucune raison de faire dépendre le
# socle d'un client HTTP.
url = "2"
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl", "chrono-impl", "no-serde-warnings"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
