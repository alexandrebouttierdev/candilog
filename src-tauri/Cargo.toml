[package]
name = "candilog"
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
description = "Candilog — suivi de candidatures, entretiens et relances avec assistance IA locale"
authors = ["Candilog"]
license = "PolyForm-Noncommercial-1.0.0"

[lib]
# Tauri exige une bibliothèque nommée `<nom>_lib` sur mobile ; la garder sur desktop
# permet aussi aux tests d'intégration de viser le métier sans passer par le binaire.
name = "candilog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
# Lecture du presse-papiers : `navigator.clipboard.readText` n'est pas exposé par la
# webview WebKitGTK, le collage d'une offre doit donc passer par une commande Rust.
tauri-plugin-clipboard-manager = "2.3"
# Message natif affiché **avant** que le runtime Tauri n'existe : sans base ouvrable il n'y
# a ni fenêtre ni `AppHandle`, donc pas de `tauri-plugin-dialog`. Ce crate est déjà lié au
# binaire — c'est celui que le plugin de dialogue utilise —, avec les mêmes fonctionnalités.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6", "gtk3"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"

# `rusqlite` et `r2d2` sont conservés depuis l'application Iced : les dépôts SQL et
# leurs tests sont repris tels quels. Pas de sqlx en plus (cf. docs/CODE_RULES.md §0).
# Les commandes Tauri restent asynchrones en enveloppant les appels de service dans
# `tauri::async_runtime::spawn_blocking`.
# `functions` : la recherche expose `search_key` à SQLite pour normaliser accents et
# casse des deux côtés de la comparaison (docs/DATA.md).
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Export CSV des candidatures.
csv = "1"
dirs = "5"
# Analyse d'URL des champs « site web » et « profil LinkedIn ». Crate autonome plutôt que
# `reqwest::Url` : la validation vit dans `core` et n'a aucune raison de faire dépendre le
# socle d'un client HTTP.
url = "2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
async-trait = "0.1"
keyring = "4.1.5"
semver = "1"
# Vérification de l'empreinte des installateurs de mise à jour. Déjà présent dans l'arbre de
# dépendances (transitif) : le déclarer n'ajoute aucune crate, et réimplémenter SHA-256 à la
# main serait exactement le genre de code qu'il ne faut pas écrire soi-même.
sha2 = "0.10"
jsonrepair-rs = "0.2.1"
pdf-extract = "0.12.0"
printpdf = { version = "0.12.5", default-features = false, features = ["png"] }
# Décodage de la photo de profil. Déjà présent dans l'arbre de dépendances — `printpdf`
# l'utilise —, le déclarer n'ajoute donc aucune crate. Les formats sont restreints à ceux
# que Candilog accepte : rien ne justifie de lier les décodeurs TIFF, DDS ou HDR.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Encodage de la photo en `data:` URL pour la webview, qui n'a pas accès au disque. Déjà
# transitif lui aussi ; l'écrire à la main serait exactement le genre de code à ne pas
# réimplémenter.
base64 = "0.22"
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl", "chrono-impl", "no-serde-warnings"] }

[dev-dependencies]
tempfile = "3"
# Les tests inspectent uniquement la structure PDF. Les fonctions de polices activées par
# défaut tirent `ttf-parser`, désormais non maintenu, sans être utilisées ici.
lopdf = { version = "0.44", default-features = false }

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
pdf-extract = { path = "../vendor/pdf-extract-0.12.0" }
