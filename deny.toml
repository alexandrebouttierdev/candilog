# Contrôle de la chaîne d'approvisionnement : licences et avis de sécurité.
#
#     cargo deny --manifest-path src-tauri/Cargo.toml check

[graph]
all-features = true

[advisories]
version = 2
# Ces avis `unmaintained` n'ont aucune mise à jour sûre : `rust-unic` est imposé par
# `urlpattern` dans `tauri-utils`, et `proc-macro-error` par les liaisons GTK3 du runtime
# Tauri Linux stable. Les vulnérabilités corrigibles ne doivent jamais être ajoutées ici.
#
# **Revue du 2026-10-04.** Les dix avis des liaisons GTK3 elles-mêmes
# (`RUSTSEC-2024-0411` à `-0420` : gtk, gdk, atk, gtk-sys…) ont été **retirés** de la base
# RustSec le 2026-08-14 et ne sont plus remontés par l'arbre. `cargo deny` les signalait en
# `advisory-not-detected` : ils sont retirés d'ici. L'avis `RUSTSEC-2024-0429` (`glib`,
# unsound) reste signalé en avertissement, sans mise à jour disponible sur la lignée GTK3.
#
# **Prochaine revue le 2027-05-31.** Ne pas se contenter d'un `cargo deny` vert à
# l'échéance : il le restera. Rejouer la liste sans elle —
#
#     cargo deny --manifest-path src-tauri/Cargo.toml check advisories \
#       --config <(sed 's/^ignore = \[/ignore = []\n_ = [/' deny.toml)
#
# — puis retirer d'ici tout avis que l'arbre ne remonte plus, et traiter ceux qui ont gagné
# une version corrigée. La procédure et la décision vivent dans `docs/RELEASES.md`.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error transitif via GTK3; aucune mise à jour sûre" },
    { id = "RUSTSEC-2025-0081", reason = "rust-unic transitif via tauri-utils/urlpattern; aucune mise à jour sûre" },
    { id = "RUSTSEC-2025-0075", reason = "rust-unic transitif via tauri-utils/urlpattern; aucune mise à jour sûre" },
    { id = "RUSTSEC-2025-0080", reason = "rust-unic transitif via tauri-utils/urlpattern; aucune mise à jour sûre" },
    { id = "RUSTSEC-2025-0100", reason = "rust-unic transitif via tauri-utils/urlpattern; aucune mise à jour sûre" },
    { id = "RUSTSEC-2025-0098", reason = "rust-unic transitif via tauri-utils/urlpattern; aucune mise à jour sûre" },
]

[licenses]
version = 2
allow = [
    "PolyForm-Noncommercial-1.0.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    # Jeu de racines de certification Mozilla embarqué par `webpki-roots`.
    "CDLA-Permissive-2.0",
]
# N'autoriser que des licences réellement rencontrées : `cargo deny` signale les autres par
# `license-not-encountered`, et une entrée périmée fait croire à un contrôle qui n'a pas
# lieu. Les polices OFL de l'application sont des **assets**, jamais vus par cargo-deny :
# elles sont attribuées dans `THIRD_PARTY_NOTICES.md`.
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
