name: Anomalie
description: Un comportement qui ne correspond pas à ce que l'application annonce.
labels: ["anomalie"]
body:
  - type: markdown
    attributes:
      value: |
        Merci du signalement. Une faille de sécurité ne se signale **pas** ici :
        voir [`SECURITY.md`](https://github.com/alexandrebouttierdev/candilog/blob/master/SECURITY.md).

  - type: textarea
    id: constate
    attributes:
      label: Ce qui se passe
      description: Décrivez le comportement observé, pas votre hypothèse sur sa cause.
    validations:
      required: true

  - type: textarea
    id: attendu
    attributes:
      label: Ce que vous attendiez
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Les étapes, dans l'ordre, depuis l'ouverture de l'application.
      placeholder: |
        1. Ouvrir Candidatures
        2. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version de Candilog
      description: Réglages → À propos.
      placeholder: "0.0.1"
    validations:
      required: true

  - type: dropdown
    id: systeme
    attributes:
      label: Système
      options:
        - Windows
        - macOS
        - Ubuntu / Debian
        - Fedora / RHEL
        - Autre Linux
    validations:
      required: true

  - type: textarea
    id: journal
    attributes:
      label: Extrait du journal
      description: |
        `candilog.log` du dossier de données (chemins listés dans le README, section
        « Vos données »). Relisez-le avant de le coller : il peut contenir des noms
        d'entreprises ou de contacts.
      render: text
    validations:
      required: false
