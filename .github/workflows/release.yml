# Build Tauri multi-plateforme et publication d'une GitHub Release publique.
# Déclenché à chaque push sur master (et manuellement). Si le tag v<version>
# existe déjà, le workflow s'arrête sans republier.

name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lire la version et vérifier le tag
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "Impossible de lire la version dans src-tauri/Cargo.toml" >&2
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # `gh release view` sort en 1 aussi bien pour un tag absent que pour une panne
          # d'API, un jeton sans droit ou une limite de débit. Confondre les deux lançait
          # trois builds complets pour finir sur un `gh release create` en échec, avec un
          # rouge qui n'indiquait pas la vraie cause. On sépare donc les deux cas sur le
          # message d'erreur, seul signal que `gh` expose ici.
          if sortie="$(gh release view "$tag" --repo "${{ github.repository }}" 2>&1)"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} déjà publiée — skip."
          elif printf '%s' "$sortie" | grep -qi "release not found"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Nouvelle release ${tag}."
          else
            echo "Impossible d'interroger les releases de ${{ github.repository }} :" >&2
            printf '%s\n' "$sortie" >&2
            exit 1
          fi

  quality:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `poppler-utils` n'est pas un prérequis de construction mais une dépendance
      # d'exécution (`docs/DEVELOPMENT.md`) : ce job exécute les tests Rust, et sans
      # `pdftotext` l'extraction de texte retombe sur l'ordre du flux — le test de mise en
      # page à deux colonnes échoue alors que le code est correct.
      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            poppler-utils

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Majeure explicite et non `lts/*` : l'arrivée d'un nouveau LTS changeait la
          # version sous le job sans qu'aucune ligne du dépôt ne bouge. Node 26 expose un
          # `localStorage` global indéfini qui masque celui de jsdom (cf. le substitut de
          # `src/shared/lib/test-setup.ts`) — exactement le genre de rupture qu'une montée
          # subie fait découvrir sur une publication. La montée reste une décision datée.
          node-version: "24"

      # Corepack s'active **après** `setup-node` : il dépose ses shims à côté du `node`
      # alors actif, et `setup-node` met le sien en tête de `PATH`. Activé avant, les shims
      # visent une autre installation et `yarn` retombe sur celui de l'image (1.22.22), qui
      # refuse le `packageManager: yarn@4.9.1` du dépôt — l'échec du build Windows.
      #
      # `cache: yarn` est retiré pour la même raison : `setup-node` exécute `yarn cache dir`
      # avant que Corepack n'ait fourni Yarn 4, donc avec ce même Yarn 1.22.22. Le cache est
      # global (`enableGlobalCache`), donc sans chemin commun aux trois systèmes.
      - name: Activer Corepack (Yarn épinglé par package.json)
        run: corepack enable

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.91"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Vérifier le frontend
        run: |
          yarn install --immutable
          yarn lint
          yarn test
          yarn build

      - name: Installer cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Vérifier le natif
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
          cargo deny --manifest-path src-tauri/Cargo.toml check

      # Le scénario de bout en bout des documents est derrière une variable d'environnement
      # parce qu'il écrit des artefacts ; il ne demande ni modèle, ni réseau, ni affichage,
      # et couvre la seule chaîne que les tests unitaires ne parcourent pas d'un bout à
      # l'autre : profil → génération → composition → PDF. Le laisser hors CI revenait à ne
      # jamais l'exécuter (`docs/DEVELOPMENT.md`).
      - name: Vérifier la chaîne complète des documents
        env:
          CANDILOG_E2E: "1"
          # Mode synthétique et non rejeu : le rejeu lit les générations enregistrées sous
          # `test-output/`, qui n'est pas versionné et n'existe donc pas sur un checkout
          # neuf — l'étape échouait sur les dix profils, « aucune génération enregistrée ».
          # Le mode synthétique compose des artefacts factuels sans cache ni appel IA, et
          # exerce ce que cette étape doit protéger : composition, mesure et export PDF.
          CANDILOG_E2E_SYNTHETIC: "1"
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test e2e_documents

  build:
    needs: [prepare, quality]
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: macos
          - platform: windows-latest
            args: ""
            rust_targets: ""
            bundles: windows
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
            bundles: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer les dépendances système (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Majeure explicite et non `lts/*` : l'arrivée d'un nouveau LTS changeait la
          # version sous le job sans qu'aucune ligne du dépôt ne bouge. Node 26 expose un
          # `localStorage` global indéfini qui masque celui de jsdom (cf. le substitut de
          # `src/shared/lib/test-setup.ts`) — exactement le genre de rupture qu'une montée
          # subie fait découvrir sur une publication. La montée reste une décision datée.
          node-version: "24"

      # Corepack s'active **après** `setup-node` : il dépose ses shims à côté du `node`
      # alors actif, et `setup-node` met le sien en tête de `PATH`. Activé avant, les shims
      # visent une autre installation et `yarn` retombe sur celui de l'image (1.22.22), qui
      # refuse le `packageManager: yarn@4.9.1` du dépôt — l'échec du build Windows.
      #
      # `cache: yarn` est retiré pour la même raison : `setup-node` exécute `yarn cache dir`
      # avant que Corepack n'ait fourni Yarn 4, donc avec ce même Yarn 1.22.22. Le cache est
      # global (`enableGlobalCache`), donc sans chemin commun aux trois systèmes.
      - name: Activer Corepack (Yarn épinglé par package.json)
        run: corepack enable

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.91"
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les dépendances frontend
        run: yarn install --immutable

      # La signature et la notarisation sont faites par le CLI Tauri lui-même : il lit
      # ces variables, importe le certificat dans un trousseau éphémère, signe le
      # binaire universel et le .dmg, puis notarise et agrafe le .app. La garde sur
      # `APPLE_CERTIFICATE` évite d'exporter des valeurs vides si les secrets ne sont
      # pas encore posés : le CLI prendrait une chaîne vide pour un certificat et
      # échouerait, alors qu'une variable absente lui fait sauter la signature sans
      # échec. La liste est verrouillée par `docs/RELEASES.md`, et
      # `bundle.macOS.signingIdentity` n'est volontairement pas dans `tauri.conf.json`
      # pour ne pas imposer le certificat aux builds locaux.
      #
      # La notarisation s'authentifie par clé API App Store Connect (JWT), pas par
      # identifiant Apple : Apple refuse le mot de passe d'application (401) depuis
      # les adresses de la CI, qu'il ne reconnaît pas comme la session du compte.
      - name: Renseigner la signature Apple
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE}"
              echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}"
              echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}"
            } >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_CONTENT" ]; then
            mkdir -p private_keys
            printf '%s' "$APPLE_API_KEY_CONTENT" > "private_keys/AuthKey_${APPLE_API_KEY}.p8"
            {
              echo "APPLE_API_KEY=${APPLE_API_KEY}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
              echo "APPLE_API_KEY_PATH=$(pwd)/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            } >> "$GITHUB_ENV"
          fi

      - name: Construire Candilog
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Préparer les assets renommés
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_pair() {
            local src="$1"
            local slug="$2"
            local ext="$3"
            if [ ! -f "$src" ]; then
              echo "Artefact manquant : $src" >&2
              exit 1
            fi
            cp "$src" "release-assets/candilog-${slug}-${VERSION}.${ext}"
            cp "$src" "release-assets/candilog-${slug}-latest.${ext}"
            echo "Préparé candilog-${slug}-{${VERSION},latest}.${ext}"
          }

          case "$BUNDLES" in
            linux)
              deb="$(ls -1 src-tauri/target/release/bundle/deb/*.deb | head -n1)"
              rpm="$(ls -1 src-tauri/target/release/bundle/rpm/*.rpm | head -n1)"
              copy_pair "$deb" ubuntu deb
              copy_pair "$rpm" fedora rpm
              ;;
            macos)
              dmg="$(ls -1 src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)"
              copy_pair "$dmg" macos dmg
              ;;
            windows)
              exe="$(ls -1 src-tauri/target/release/bundle/nsis/*.exe | head -n1)"
              copy_pair "$exe" windows exe
              ;;
            *)
              echo "Matrice inconnue : $BUNDLES" >&2
              exit 1
              ;;
          esac

      - name: Publier les artefacts de build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candilog-${{ matrix.bundles }}
          path: release-assets/*
          if-no-files-found: error

  # Tauri ne produit pas de paquet pacman : ce job reconditionne le `.deb` du job Linux
  # avec `packaging/arch/PKGBUILD`, dans un conteneur Arch officiel. Rien n'est recompilé,
  # le binaire est celui du `.deb`. `makepkg` refuse de tourner en root, d'où l'utilisateur
  # dédié ; `--nodeps` parce que les dépendances d'exécution (WebKitGTK…) n'ont pas à être
  # installées pour empaqueter.
  arch:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Télécharger le paquet Debian
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candilog-linux
          path: linux-assets

      - name: Construire le paquet Arch Linux
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          deb="linux-assets/candilog-ubuntu-${VERSION}.deb"
          if [ ! -f "$deb" ]; then
            echo "Artefact manquant : $deb" >&2
            exit 1
          fi
          # pacman n'accepte pas de tiret dans pkgver (1.0.0-beta → 1.0.0_beta).
          pkgver="${VERSION//-/_}"
          work="$(mktemp -d)"
          cp packaging/arch/PKGBUILD "$work/PKGBUILD"
          cp "$deb" "$work/candilog.deb"
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" "$work/PKGBUILD"
          useradd --create-home builder
          chown -R builder "$work"
          su builder -c "cd '$work' && makepkg --nodeps --noconfirm"

          pkg="$(ls -1 "$work"/candilog-"${pkgver}"-*-x86_64.pkg.tar.zst | head -n1)"
          if [ -z "$pkg" ]; then
            echo "makepkg n'a produit aucun paquet" >&2
            exit 1
          fi
          # Le paquet doit porter les licences redistribuées, comme le .deb. La liste est
          # lue d'abord : `bsdtar | grep -q` échouerait sous pipefail (SIGPIPE).
          contenu="$(bsdtar -tf "$pkg")"
          for attendu in \
            usr/lib/Candilog/LICENSE \
            usr/lib/Candilog/licenses/ibm-plex-OFL-1.1.txt \
            usr/share/licenses/candilog/LICENSE; do
            if ! grep -qx "$attendu" <<< "$contenu"; then
              echo "Absent du paquet Arch : $attendu" >&2
              exit 1
            fi
          done

          mkdir -p release-assets
          cp "$pkg" "release-assets/candilog-arch-${VERSION}.pkg.tar.zst"
          cp "$pkg" "release-assets/candilog-arch-latest.pkg.tar.zst"
          ls -la release-assets

      - name: Publier l'artefact Arch Linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candilog-arch
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [prepare, build, arch]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Signature de provenance : `id-token` fournit le jeton OIDC que Sigstore échange
      # contre un certificat éphémère, `attestations` publie l'attestation sur le dépôt.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Télécharger tous les assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      # L'application refuse d'ouvrir un installateur dont l'empreinte n'est pas publiée
      # ici : c'est la seule garantie sur le contenu du fichier téléchargé.
      - name: Calculer les empreintes SHA-256
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Signature de provenance Sigstore. Elle ne remplace pas un certificat d'éditeur —
      # SmartScreen et Gatekeeper l'ignorent — mais elle est la seule preuve cryptographique
      # gratuite que ces fichiers précis sortent de ce dépôt, de ce commit et de ce
      # workflow. `SHA256SUMS` atteste l'intégrité du transfert ; ceci atteste l'origine.
      #
      # Vérification côté utilisateur :
      #   gh attestation verify <fichier> --repo alexandrebouttierdev/candilog
      - name: Attester la provenance des binaires
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "release-assets/*"

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ls -la release-assets
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Candilog ${VERSION}" \
            --notes "Build automatique depuis \`master\` (commit ${{ github.sha }}).

          Téléchargements stables (toujours la dernière version) :
          - Windows : \`candilog-windows-latest.exe\`
          - macOS : \`candilog-macos-latest.dmg\`
          - Ubuntu / Debian : \`candilog-ubuntu-latest.deb\`
          - Fedora : \`candilog-fedora-latest.rpm\`
          - Arch Linux : \`candilog-arch-latest.pkg.tar.zst\` (\`sudo pacman -U candilog-arch-latest.pkg.tar.zst\`)

          Des copies versionnées (\`candilog-*-${VERSION}.*\`) sont aussi jointes.

          ### Vérifier votre téléchargement

          Les empreintes SHA-256 de tous les fichiers sont publiées dans \`SHA256SUMS\`, et Candilog les vérifie avant d'ouvrir un installateur téléchargé depuis l'application. Pour contrôler vous-même un fichier téléchargé à la main, placez-le à côté de \`SHA256SUMS\` puis :

          \`\`\`
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          Chaque binaire porte aussi une **attestation de provenance** Sigstore, qui prouve qu'il a été construit par ce dépôt, depuis ce commit, par ce workflow :

          \`\`\`
          gh attestation verify candilog-windows-latest.exe --repo ${{ github.repository }}
          \`\`\`

          ### Signature

          Les binaires **macOS** sont signés avec un certificat *Developer ID Application* et notariés par Apple : Gatekeeper les ouvre sans intervention. Les binaires **Windows** ne portent pas encore de signature de code commerciale : SmartScreen affiche « Éditeur inconnu » au premier lancement — passer par *Informations complémentaires → Exécuter quand même*. Sur Linux, aucun avertissement particulier.

          L'empreinte SHA-256 atteste que le fichier est arrivé intact, l'attestation de provenance qu'il vient bien d'ici. La procédure complète est décrite dans le README." \
            release-assets/*
