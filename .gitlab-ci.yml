stages:
  - quality
  - build

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-cache"

cache:
  key: "cargo-$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo-cache/
    - target/

quality:
  stage: quality
  image: rust:1.91-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --check
    - cargo check --all-targets --all-features
    - cargo clippy --all-targets --all-features -- -D warnings
    - cargo test --all-targets --all-features

build-linux:
  stage: build
  image: rust:1.91-bookworm
  needs: [quality]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev
  script:
    - cargo build --release --locked
  artifacts:
    name: "candilog-linux-$CI_COMMIT_TAG"
    paths:
      - target/release/candilog
    expire_in: 30 days

build-windows:
  stage: build
  tags: [windows, desktop-windows]
  needs: [quality]
  when: manual
  script:
    - cargo build --release --locked
  artifacts:
    name: "candilog-windows-$CI_COMMIT_TAG"
    paths:
      - target/release/candilog.exe
    expire_in: 30 days

build-macos:
  stage: build
  tags: [macos-14]
  needs: [quality]
  when: manual
  script:
    - cargo build --release --locked
  artifacts:
    name: "candilog-macos-$CI_COMMIT_TAG"
    paths:
      - target/release/candilog
    expire_in: 30 days

