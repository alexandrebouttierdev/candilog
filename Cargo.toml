[package]
name = "candilog"
version = "0.2.0"
edition = "2021"
# Version minimale du compilateur, alignée sur l'image de l'intégration continue
# (`rust:1.91-bookworm`). Contrainte par `Duration::from_mins` (shared/http.rs), stabilisée en
# 1.91.0 : Cargo refuse désormais de compiler avec une chaîne plus ancienne, avec un message
# explicite, au lieu de laisser la divergence n'apparaître qu'en CI.
rust-version = "1.91"
description = "Candilog Desktop natif en Rust et Iced"
authors = ["Candilog"]
license = "MIT"

[package.metadata]
repository = "https://github.com/alexandrebouttierdev/candilog"
keywords = ["candidature", "emploi", "cv", "desktop", "sqlite"]
categories = ["gui"]

[package.metadata.deb]
maintainer = "Alexandre Bouttier <alexandrebouttierdev@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto, libxkbcommon0, libwayland-client0, libx11-6, libdbus-1-3, libvulkan1"
assets = [
  ["target/release/candilog", "usr/bin/", "755"],
  ["packaging/candilog.desktop", "usr/share/applications/", "644"],
  ["packaging/icons/hicolor/16x16/apps/candilog.png", "usr/share/icons/hicolor/16x16/apps/candilog.png", "644"],
  ["packaging/icons/hicolor/32x32/apps/candilog.png", "usr/share/icons/hicolor/32x32/apps/candilog.png", "644"],
  ["packaging/icons/hicolor/48x48/apps/candilog.png", "usr/share/icons/hicolor/48x48/apps/candilog.png", "644"],
  ["packaging/icons/hicolor/64x64/apps/candilog.png", "usr/share/icons/hicolor/64x64/apps/candilog.png", "644"],
  ["packaging/icons/hicolor/128x128/apps/candilog.png", "usr/share/icons/hicolor/128x128/apps/candilog.png", "644"],
  ["packaging/icons/hicolor/256x256/apps/candilog.png", "usr/share/icons/hicolor/256x256/apps/candilog.png", "644"],
  ["packaging/icons/hicolor/512x512/apps/candilog.png", "usr/share/icons/hicolor/512x512/apps/candilog.png", "644"],
]

[package.metadata.generate-rpm]
name = "candilog"
summary = "Suivi de candidatures, entretiens et relances avec assistance IA locale"
license = "MIT"
url = "https://github.com/alexandrebouttierdev/candilog"
requires = "libxkbcommon, libwayland-client, libX11, dbus-libs, vulkan-loader"
assets = [
  { source = "target/release/candilog", dest = "/usr/bin/candilog", mode = "755" },
  { source = "packaging/candilog.desktop", dest = "/usr/share/applications/candilog.desktop", mode = "644" },
  { source = "packaging/icons/hicolor/256x256/apps/candilog.png", dest = "/usr/share/icons/hicolor/256x256/apps/candilog.png", mode = "644" },
]

[features]
default = []
# Harnais de capture visuelle (revue de design) : variables d'environnement
# `CANDILOG_CAPTURE_*` qui pilotent la route, le thème, les dialogues et les états particuliers,
# puis écrivent un PPM au chemin indiqué avant de quitter. Hors du binaire distribué par défaut :
# c'est une surface fonctionnelle qui n'est pas destinée aux utilisateurs.
# `CANDILOG_DATA_DIR` n'en dépend pas et reste disponible en toutes circonstances.
capture = []

# Correctif local de `pdf-extract` 0.12.0 (voir `vendor/pdf-extract-0.12.0/README`).
# `pdf-extract` lisait `c_last` et `c_width` depuis `w[i]` au lieu de `w[i + 1]` et
# `w[i + 2]` dans le tableau `/W` des polices CID : les largeurs déclarées au format
# range (`c_first c_last w`, utilisé par LibreOffice) n'étaient jamais appliquées, et
# l'extraction fabriquait un espace parasite (« D éveloppeur » au lieu de
# « Développeur »). Le correctif est vendored pour ne pas dépendre d'un fork non publié.
[patch.crates-io]
pdf-extract = { path = "vendor/pdf-extract-0.12.0" }

[dependencies]
iced = { version = "0.13", features = ["tokio", "image", "svg", "canvas", "advanced", "lazy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonrepair-rs = "0.2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
pdf-extract = "0.12.0"
keyring = "4.1.5"
regex = "1"
sha2 = "0.10"
csv = "1"
dirs = "5"
rfd = "0.15"
notify-rust = "4"
lopdf = "0.42"
semver = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.5"
printpdf = { version = "0.12.5", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
mockito = "1"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["settings", "tokio"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
