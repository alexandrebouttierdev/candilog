[package]
name = "candilog"
version = "0.2.0"
edition = "2021"
description = "Candilog Desktop natif en Rust et Iced"
authors = ["Candilog"]
license = "MIT"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image", "svg", "canvas", "advanced", "lazy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonrepair-rs = "0.2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
pdf-extract = "0.12.0"
keyring = "4.1.5"
regex = "1"
sha2 = "0.10"
csv = "1"
dirs = "5"
rfd = "0.15"
notify-rust = "4"
lopdf = "0.43"
semver = "1"
minisign-verify = "0.2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
mockito = "1"

[profile.release]
lto = "thin"
strip = true
